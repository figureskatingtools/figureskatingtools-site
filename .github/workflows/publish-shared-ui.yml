name: Publish shared-ui

on:
  push:
    branches: [main]
    paths:
      - 'packages/shared-ui/**'
  # Manual trigger so a version bump on a non-default branch (e.g. test) can be
  # published without first promoting to main. Publishes whatever version is in
  # packages/shared-ui/package.json on the dispatched ref.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish @figureskatingtools/shared-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
