name: Publish shared-ui

# Manual-only: the site consumes shared-ui via the workspace symlink, never
# from GitHub Packages — the registry publish exists solely for the tool
# repos' legacy v2.x frontends and is retired with them. Dispatch from the
# ref whose packages/shared-ui/package.json version you want to publish
# (publishing an already-published version fails with 409).

# Runner image is pinned on purpose. The ubuntu-latest label moves from Ubuntu
# 24.04 to 26.04 between 2026-10-19 and 2026-11-19
# (https://github.com/actions/runner-images/issues/14748), so an explicit label
# keeps a -latest flip from changing the deploy OS under us mid-rollout.
# Bump it deliberately: change every runs-on in this file together, dispatch
# the workflow against the test environment first, then promote. Never set it
# back to ubuntu-latest. Rollback label: ubuntu-24.04.

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish @figureskatingtools/shared-ui
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: packages/shared-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
