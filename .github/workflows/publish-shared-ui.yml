name: Publish shared-ui

# Manual-only: the site consumes shared-ui via the workspace symlink, never
# from GitHub Packages — the registry publish exists solely for the tool
# repos' legacy v2.x frontends and is retired with them. Dispatch from the
# ref whose packages/shared-ui/package.json version you want to publish
# (publishing an already-published version fails with 409).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build & Publish @figureskatingtools/shared-ui
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-ui

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
