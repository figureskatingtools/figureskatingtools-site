name: Deploy Site to Azure

on:
  push:
    branches: [main, test, dev]
    paths:
      - 'site/**'
      - 'infra/**'
      - '.github/workflows/deploy-site.yml'

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  set-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: Set environment name
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/test" ]]; then
            echo "env_name=test" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            echo "env_name=dev" >> "$GITHUB_OUTPUT"
          fi

  deploy-infra:
    name: Deploy Infrastructure
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    outputs:
      swa_name: ${{ steps.deploy.outputs.swaName }}
      swa_hostname: ${{ steps.deploy.outputs.swaDefaultHostname }}
      resource_group_name: ${{ steps.deploy.outputs.resourceGroupName }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy
        run: |
          ENV_NAME="${{ needs.set-environment.outputs.env_name }}"
          DEPLOYMENT_NAME="deploy-fs-site-$(date +%s)"

          OUTPUT=$(az deployment sub create \
            --location "${{ vars.LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${ENV_NAME}.bicepparam \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs' \
            -o json)

          echo "swaName=$(echo "$OUTPUT" | jq -r '.swaName.value')" >> "$GITHUB_OUTPUT"
          echo "swaDefaultHostname=$(echo "$OUTPUT" | jq -r '.swaDefaultHostname.value')" >> "$GITHUB_OUTPUT"
          echo "resourceGroupName=$(echo "$OUTPUT" | jq -r '.resourceGroupName.value')" >> "$GITHUB_OUTPUT"

      - name: Configure SWA auth app settings
        run: |
          az staticwebapp appsettings set \
            --name "${{ steps.deploy.outputs.swaName }}" \
            --resource-group "${{ steps.deploy.outputs.resourceGroupName }}" \
            --setting-names \
              AZURE_CLIENT_ID="${{ secrets.AUTH_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AUTH_CLIENT_SECRET }}"

      - name: Update app registration redirect URIs
        run: |
          set -euo pipefail

          AUTH_APP_OBJECT_ID="${{ secrets.AUTH_APP_OBJECT_ID }}"
          SWA_HOSTNAME="${{ steps.deploy.outputs.swaDefaultHostname }}"
          CUSTOM_DOMAIN="${{ vars.CUSTOM_DOMAIN }}"

          if [ -z "${AUTH_APP_OBJECT_ID}" ]; then
            echo "WARNING: AUTH_APP_OBJECT_ID not set, skipping redirect URI update."
            exit 0
          fi

          echo "Updating redirect URIs on app registration..."
          if [ -n "${CUSTOM_DOMAIN}" ]; then
            REDIRECT_URIS=$(jq -n \
              --arg swa "https://${SWA_HOSTNAME}/.auth/login/aad/callback" \
              --arg custom "https://${CUSTOM_DOMAIN}/.auth/login/aad/callback" \
              '{web: {redirectUris: [$swa, $custom]}}')
          else
            REDIRECT_URIS=$(jq -n \
              --arg swa "https://${SWA_HOSTNAME}/.auth/login/aad/callback" \
              '{web: {redirectUris: [$swa]}}')
          fi

          az rest --method PATCH \
            --uri "https://graph.microsoft.com/v1.0/applications/${AUTH_APP_OBJECT_ID}" \
            --headers 'Content-Type=application/json' \
            --body "$REDIRECT_URIS"
          echo "Redirect URIs updated."

  deploy-frontend:
    name: Deploy Frontend (Static Web App)
    needs: [set-environment, deploy-infra]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          scripts/generate-changelog.sh site/public/changelog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: |
          cd site
          npm run build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: get-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ needs.deploy-infra.outputs.swa_name }}" \
            --resource-group "${{ needs.deploy-infra.outputs.resource_group_name }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/dist
          skip_app_build: true
