name: Deploy Site to Azure

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'infra/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        type: choice
        required: true
        default: test
        options:
          - test
          - prod

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  set-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.set-env.outputs.env_name }}
    steps:
      - name: Set environment name
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "env_name=${{ github.event.inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> "$GITHUB_OUTPUT"
          fi

  deploy-infra:
    name: Deploy Infrastructure
    needs: set-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    outputs:
      swa_name: ${{ steps.deploy.outputs.swaName }}
      swa_hostname: ${{ steps.deploy.outputs.swaDefaultHostname }}
      resource_group_name: ${{ steps.deploy.outputs.resourceGroupName }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Bicep template
        id: deploy
        run: |
          ENV_NAME="${{ needs.set-environment.outputs.env_name }}"
          DEPLOYMENT_NAME="deploy-fs-site-$(date +%s)"

          OUTPUT=$(az deployment sub create \
            --location "${{ vars.LOCATION }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/${ENV_NAME}.bicepparam \
            --name "$DEPLOYMENT_NAME" \
            --query 'properties.outputs' \
            -o json)

          echo "swaName=$(echo "$OUTPUT" | jq -r '.swaName.value')" >> "$GITHUB_OUTPUT"
          echo "swaDefaultHostname=$(echo "$OUTPUT" | jq -r '.swaDefaultHostname.value')" >> "$GITHUB_OUTPUT"
          echo "resourceGroupName=$(echo "$OUTPUT" | jq -r '.resourceGroupName.value')" >> "$GITHUB_OUTPUT"

      - name: Configure SWA auth app settings
        run: |
          az staticwebapp appsettings set \
            --name "${{ steps.deploy.outputs.swaName }}" \
            --resource-group "${{ steps.deploy.outputs.resourceGroupName }}" \
            --setting-names \
              AZURE_CLIENT_ID="${{ secrets.AUTH_CLIENT_ID }}" \
              AZURE_CLIENT_SECRET="${{ secrets.AUTH_CLIENT_SECRET }}"

      # NOTE: Auth-app redirect URIs are managed manually (the deploy principal has no
      # Microsoft Graph rights to PATCH the app registration). Add the per-environment
      # callbacks once via Entra/az; they're stable for the life of the SWA + custom domain:
      #   prod: https://figureskatingtools.com/.auth/login/aad/callback
      #   test: https://test.figureskatingtools.com/.auth/login/aad/callback
      #         https://<swa-default-hostname>/.auth/login/aad/callback

  deploy-frontend:
    name: Deploy Frontend (Static Web App)
    needs: [set-environment, deploy-infra]
    runs-on: ubuntu-latest
    environment: ${{ needs.set-environment.outputs.env_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared-ui
        # site depends on the local @figureskatingtools/shared-ui workspace, whose
        # main/types point at dist/. Build it first or site's tsc fails with TS2307.
        run: npm run build --workspace=@figureskatingtools/shared-ui

      - name: Generate changelog
        run: |
          chmod +x scripts/generate-changelog.sh
          scripts/generate-changelog.sh site/public/changelog.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build site
        run: |
          cd site
          npm run build

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get SWA deployment token
        id: get-token
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name "${{ needs.deploy-infra.outputs.swa_name }}" \
            --resource-group "${{ needs.deploy-infra.outputs.resource_group_name }}" \
            --query "properties.apiKey" -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Deploy to Azure Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.get-token.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site/dist
          skip_app_build: true
